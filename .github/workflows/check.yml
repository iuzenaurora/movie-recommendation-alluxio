name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/check_source.py
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check_release.py
      - run: docker compose config --quiet
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
      - run: composer install --working-dir=web --no-interaction --prefer-dist
      - run: cp web/.env.example web/.env
      - name: Prepare Laravel runtime directories
        run: mkdir -p web/storage/framework/views web/storage/framework/sessions web/storage/framework/cache/data web/storage/logs
      - name: Check PHP syntax
        run: find web/app web/routes web/config web/database web/tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan test --compact
        working-directory: web
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SESSION_DRIVER: array
          CACHE_STORE: array
